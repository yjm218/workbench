<!DOCTYPE html>
<html lang="zh-CN">

<meta name="theme-color" content="#ff4d6d" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<body>
<div id="app">

  <div class="layout">

  <!-- 遮罩(移动端抽屉) -->
  <div class="scrim" id="scrim"></div>

  <!-- 轻提示 -->
